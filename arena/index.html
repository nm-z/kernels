<!doctype html><html><head><meta charset=utf-8><title>nlfm arena</title><style>
html,body{height:100%;margin:0;background:#000;color:#fff;font:16px/1.4 ui-monospace,monospace}
body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.q{padding:16px;overflow:hidden;white-space:pre-wrap;word-break:break-word;border:0 solid #fff}
#q1,#q2{border-bottom-width:1px}#q1,#q3{border-right-width:1px}
.n{color:#277DFF}.best{color:#00AE6B}
</style></head><body><div class=q id=q1></div><div class=q id=q2></div><div class=q id=q3></div><div class=q id=q4></div>
<script>
(async () => {
  const q = [1,2,3,4].map(i => document.getElementById('q' + i));
  const line = (d, cls, t) => { const p = document.createElement('div'); if (cls) p.className = cls; p.textContent = t; d.appendChild(p); d.scrollTop = d.scrollHeight; return p; };
  let cur = [];
  const r = await fetch('events' + location.search); const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
  for (;;) {
    const {value, done} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true}); let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const l = buf.slice(0, i); buf = buf.slice(i + 1); if (!l) continue;
      const e = JSON.parse(l);
      if (e.nate !== undefined) {                       // a sample starts: nate's line, then an empty reply line in each pane
        cur = q.map(d => { line(d, 'n', 'nate: ' + e.nate); return line(d, '', ''); });
      } else if (e.t !== undefined) {                   // tokens for pane p
        const d = q[e.p - 1]; cur[e.p - 1].textContent += e.t; d.scrollTop = d.scrollHeight;
      } else if (e.scores !== undefined) {              // scored: the score in front of the reply, the best in green
        q.forEach((d, k) => {
          const best = e.best === k + 1;
          if (best) cur[k].className = 'best';
          line(d, best ? 'best' : '', 'jev ' + (e.scores[k] == null ? e.error : e.scores[k].toFixed(2)));
          line(d, '', '');
        });
      }
    }
  }
})();
</script></body></html>
